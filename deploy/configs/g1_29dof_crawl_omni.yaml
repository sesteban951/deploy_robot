xml_path: "g1_29dof_scene.xml"
policy_path: "crawl_omni_alldir.onnx"

# gait clock
motion_period_frames: 130   # T: frames per gait cycle (phase = t/T); 130 @ 50 Hz = 2.6 s

default_twist:  [0.20,  0.0,   0.0]   # autonomous mid-forward crawl when no joystick
twist_scale:    [0.30,  0.12,  0.60]  # input -> [vx, vy, wz] (full stick/trigger -> trained range max)
twist_clip_lo:  [-0.25, -0.12, -0.60] # raw command safety box: trained TWIST_RANGE mins
twist_clip_hi:  [ 0.30,  0.12,  0.60] # raw command safety box: trained TWIST_RANGE maxs
                                      # (mjlab tasks/crawling_omni/config/g1/env_cfgs.py: TWIST_RANGE)

# --- mode selection + command shaping (utils/crawl_modes.py) --------------------------
# The gait library is 3 disjoint motions (forward / backward / in-place turn) + idle.
# Each control step the commanded twist selects a mode by magnitude, then is clamped to
# that mode's trained range so we never command a combination the library lacks (which
# otherwise collapses a big forward+turn into a pure in-place spin).
#
# mode thresholds (tune these). Mode is a partition of the vx axis:
mode_fwd_vx_min:   0.10   # vx >= this               -> forward mode
mode_bwd_vx_max:  -0.05   # vx <= this               -> backward mode
mode_turn_wz_min:  0.25   # in between: |wz| > this  -> in-place turn (else idle)
#
# per-mode gait-library ranges (facts about the trained grid; not tuning knobs):
fwd_vx_range:  [ 0.10, 0.30]   # forward vx clamp
bwd_vx_range:  [-0.25, -0.05]  # backward vx clamp
crab_max:      0.12            # |vy| cap while translating
curve_max:     0.12            # |wz| cap while translating (gentle curve)
turn_wz_range: [ 0.28, 0.60]   # in-place |wz| clamp (min turn .. max turn)

# hardware: time for the 'home' FSM state to ramp the robot from its current pose into the
# crawl idle/laydown pose (home_joint_pos). Longer = gentler standing->laydown transition.
home_pos_duration: 5.0   # [sec] (hardware.py requires >= 3.0)

# PD gains per joint (mjlab training gains, from the policy's joint_stiffness/damping metadata)
Kp: [40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 28.501, 28.501,  # waist
     14.251, 14.251, 14.251, 14.251, 14.251, 16.778, 16.778,
     14.251, 14.251, 14.251, 14.251, 14.251, 16.778, 16.778]
Kd: [2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 1.814, 1.814,  # waist
     0.907, 0.907, 0.907, 0.907, 0.907, 1.068, 1.068,
     0.907, 0.907, 0.907, 0.907, 0.907, 1.068, 1.068]

home_base_pos: [ 0.000476,  0.000090,  0.106523, -0.715142, -0.031392, -0.697991,  0.019848]
home_joint_pos: [ 0.004593,  0.398317,  1.158895,  0.501901,  0.163135, -0.007864,
                  0.022245, -0.586872, -1.181935,  0.565157,  0.267927,  0.077018,
                 -0.026588, -0.095096,  0.092985,
                 -1.960660,  1.607161, -0.361312, -0.170657,  0.013174,  0.264816,  0.146871,
                 -2.077732, -1.549371,  0.488804, -0.262013, -0.141616,  0.414991, -0.097014]

control_dt: 0.02
