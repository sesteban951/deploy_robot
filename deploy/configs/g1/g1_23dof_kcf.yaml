# Walking deployment. MPC gains/reference settings remain in
# kcf_mpc/config/mpc_config.py.
kcf_profile: walking
xml_path: "g1/g1_23dof_kcf.xml"
policy_path: "kcf/g1_23dof_vel.onnx"
home_pos_duration: 3.0
Kp: [40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 14.251, 14.251, 14.251, 14.251, 14.251,
     14.251, 14.251, 14.251, 14.251, 14.251]
Kd: [2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 0.907, 0.907, 0.907, 0.907, 0.907,
     0.907, 0.907, 0.907, 0.907, 0.907]
home_base_pos: [0, 0, 0.78, 1, 0, 0, 0]
home_joint_pos: [-0.1, 0, 0, 0.3, -0.2, 0,
                 -0.1, 0, 0, 0.3, -0.2, 0, 0,
                 0.35, 0.18, 0, 0.87, 0,
                 0.35, -0.18, 0, 0.87, 0]
control_dt: 0.02
gait_period: 0.6
stand_cmd_threshold: 0.05

# KCF sends physical body velocities, not normalized joystick axes.
cmd_scale: [1.0, 1.0, 1.0]
command_limits: [1.0, 1.0, 0.75]
kcf_enabled: true

kcf:
  # simulation = use the feedback as published. Hardware MUST use it: the controller already merges the
  # mocap pose into the feedback on the policy clock; 'mocap' re-merges with ROS-clock stamps and rejects them.
  state_source: simulation  # simulation or mocap
  twist_limits: [0.7, 0.7, 0.7]  # [m/s, m/s, rad/s] MPC plans only inside these (tightens its input bounds)
  version: 1
  state_dim: 85
  input_dim: 3
  nH: 256
  joint_count: 23
  recurrent_state_dim: 0
  state_schema: g1_kcf_relative85_sincos_window_v1

  results_dir: policy/g1/kcf/walking
  checkpoint: final

  runtime_factory: kcf_mpc.controller:create_profile_controller
  state_adapter: kcf_mpc.robot:state_from_feedback
  state_encoder: kcf_mpc.state.encoder:g1_closed_loop_state
  heading_encoder: kcf_mpc.state.encoder:g1_world_heading
  feedback_decoder: deploy.kcf.kcf_interface:Feedback.unpack
  robot_config_factory: kcf_mpc.robot_config:G1Config
  mpc_settings_factory: kcf_mpc.config.mpc_config:get_default_mpc_config

  artifact_sha256:
    policy/g1/kcf/walking/model_final.pt: 64142fd8a8d4d79faab3b4a20d6189b89e99e5c10d13dba623e8d72fa7f4645d
    policy/g1/kcf/walking/normalization.npz: 15f455d356d1daa075c85093b3a16f0c058591d64a55000240ccdc1e842472a2
    policy/g1/kcf/walking/config.json: 8790d90b9e77bc0f049606a8fd010df8b4af4caefef890dfe027656e9c78d4e3
    policy/g1/kcf/g1_23dof_vel.onnx: ffb67449135972590d129da9ad56bc20e8af59616a078d1919c96f83099f94b3
    models/g1/g1_23dof_kcf.xml: 5bf27a5330bdac81bd4d9426b5156400e7fa25cbc6473bf47f59e78c4652a348
