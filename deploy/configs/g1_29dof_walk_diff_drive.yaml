xml_path: "g1_29dof_mode11_scene.xml"
policy_path: "walk_diff_drive.onnx"

home_pos_duration: 3.0   # [sec] ramp into the 'home' pose; hardware.py requires >= 3.0

# T: frames per gait cycle (phase = t/T); 70 @ 50 Hz = 1.4 s. The clock free-runs, but the
# (sin, cos) obs is blanked on zero twist -- keep in sync with mjlab mdp/observations.py.
motion_period_frames: 70

default_twist:   [0.75, 0.0, 0.0]   # twist with no joystick (sim only; hardware stands)

# joystick -> twist (utils/locomotion/walk_modes.py): dominant stick picks straight XOR turn
stick_deadband:  0.15   # below this -> exactly zero twist, which the policy's idle stop keys off
mode_hysteresis: 0.10   # other stick must exceed the active one by this to switch bands
mode_dwell_time: 0.40   # [sec] minimum time in a band before a band change

# trained gait grid, not tuning knobs
fwd_vx_range:  [ 0.50,  1.00]
bwd_vx_range:  [-0.90, -0.40]
turn_wz_range: [ 0.50,  1.50]   # in-place |wz|, sign from the stick (left +)

# mode_machine 11; == the policy's joint_stiffness / joint_damping metadata
Kp: [99.098, 99.098, 40.179, 99.098, 28.501, 28.501,
     99.098, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 28.501, 28.501,  # waist
     14.251, 14.251, 14.251, 14.251, 14.251, 16.778, 16.778,
     14.251, 14.251, 14.251, 14.251, 14.251, 16.778, 16.778]
Kd: [6.309, 6.309, 2.558, 6.309, 1.814, 1.814,
     6.309, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 1.814, 1.814,  # waist; 2.814 / 3.0 tried on roll/pitch against hardware chatter
     0.907, 0.907, 0.907, 0.907, 0.907, 1.068, 1.068,
     0.907, 0.907, 0.907, 0.907, 0.907, 1.068, 1.068]

# == the policy's default_joint_pos (mj-nlp trajectories/g1/poses/stand_idle_qpos.csv)
home_base_pos: [ 0.000000,  0.000000,  0.775975,  0.999712,  0.017439,  0.016482, -0.000288]
home_joint_pos: [-0.041904,  0.091219,  0.191844,  0.224191, -0.172866, -0.098679,
                 -0.105423, -0.162146, -0.175101,  0.364097, -0.268274,  0.080175,
                 -0.017459, -0.019696,  0.150734,
                 -0.143709,  0.333022, -0.722930,  1.117706,  0.043565, -0.023893,  0.024023,
                 -0.199627, -0.326463,  0.756192,  1.029733,  0.107693,  0.016209, -0.082463]

control_dt: 0.02
