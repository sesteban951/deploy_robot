xml_path: "g1_29dof_scene.xml"
policy_path: "walk_diff_drive.onnx"

# interpolate to home position (hardware 'home' state; hardware.py requires >= 3.0)
home_pos_duration: 3.0   # [sec]

# gait clock
motion_period_frames: 70   # T: frames per gait cycle (phase = t/T); 70 @ 50 Hz = 1.4 s

default_twist:   [0.75, 0.0, 0.0]   # twist with no joystick (autonomous forward walk for viewing, sim only)

# joystick -> twist (utils/locomotion/walk_modes.py): deadband -> idle; dominant stick picks
# straight XOR turn; live stick range [deadband, 1] maps onto the band
stick_deadband:  0.15   # both sticks below this -> idle (stand)
mode_hysteresis: 0.10   # other stick must exceed the active one by this to switch bands
mode_dwell_time: 0.40   # [sec] minimum time in a band before a band change

# per-band gait-library ranges (trained grid, not tuning knobs)
fwd_vx_range:  [ 0.50,  1.00]
bwd_vx_range:  [-0.90, -0.40]
turn_wz_range: [ 0.50,  1.50]   # in-place |wz|, sign from the stick (left +)

# PD gains per joint (mjlab training gains, from the policy's joint_stiffness/damping metadata)
Kp: [40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
     40.179, 28.501, 28.501,  # waist
     14.251, 14.251, 14.251, 14.251, 14.251, 16.778, 16.778,
     14.251, 14.251, 14.251, 14.251, 14.251, 16.778, 16.778]
Kd: [2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
     2.558, 2.814, 2.814,  # waist
     0.907, 0.907, 0.907, 0.907, 0.907, 1.068, 1.068,
     0.907, 0.907, 0.907, 0.907, 0.907, 1.068, 1.068]

# standing idle pose == the policy's default_joint_pos (mj-nlp trajectories/g1/poses/stand_idle_qpos.csv)
home_base_pos: [ 0.000000,  0.000000,  0.775975,  0.999712,  0.017439,  0.016482, -0.000288]
home_joint_pos: [-0.041904,  0.091219,  0.191844,  0.224191, -0.172866, -0.098679,
                 -0.105423, -0.162146, -0.175101,  0.364097, -0.268274,  0.080175,
                 -0.017459, -0.019696,  0.150734,
                 -0.143709,  0.333022, -0.722930,  1.117706,  0.043565, -0.023893,  0.024023,
                 -0.199627, -0.326463,  0.756192,  1.029733,  0.107693,  0.016209, -0.082463]

control_dt: 0.02
