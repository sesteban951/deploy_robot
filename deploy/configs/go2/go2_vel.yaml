home_joint_pos: [-0.1, 0.9, -1.8,
                  0.1, 0.9, -1.8,
                 -0.1, 0.9, -1.8,
                  0.1, 0.9, -1.8]

control_dt: 0.02

gait_period: 0.6

stand_cmd_threshold: 0.1   # set to 0.0 for constant moving feet

