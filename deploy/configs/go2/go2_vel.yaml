xml_path: "go2/go2_scene.xml"
policy_path: "2026-11-11_00-22-53_go2_v0_vel_tracking.onnx"

# hardware stand up / lie down
#   'home' (A):  move to home_joint_pos in home_pos_duration and hold it
#   'damp' (LB): move to the lying pose, then relax to pure damping
# lying pose, lie-down time and the stiff pose gains are globals in deploy/hardware/go2/hardware.py
home_pos_duration: 1.0  # [sec]

# PD gains per joint, joint order: FL, FR, RL, RR, each hip, thigh, calf
Kp: [20.0, 20.0, 40.0,
     20.0, 20.0, 40.0,
     20.0, 20.0, 40.0,
     20.0, 20.0, 40.0]
Kd: [1.0, 1.0, 2.0,
     1.0, 1.0, 2.0,
     1.0, 1.0, 2.0,
     1.0, 1.0, 2.0]

# policy default pose (sim spawns here; hardware stands up to here in 'home'). Must match the
# policy's default_joint_pos (checked by control_vel.py). Joint order: FL, FR, RL, RR, each hip, thigh, calf
home_base_pos: [0, 0, 0.32, 1, 0, 0, 0]
home_joint_pos: [-0.1, 0.9, -1.8,
                  0.1, 0.9, -1.8,
                 -0.1, 0.9, -1.8,
                  0.1, 0.9, -1.8]

control_dt: 0.02

gait_period: 0.6

stand_cmd_threshold: 0.1   # set to 0.0 for constant moving feet

cmd_scale: [1.0, 0.5, 1.0]
